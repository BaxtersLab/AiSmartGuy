[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
utils = { path = "../utils" }
logging = { path = "../logging" }
error_system = { path = "../error_system" }
manifest = { path = "../manifest" }
rag_engine = { path = "../rag_engine" }
pdf_io = { path = "../pdf_io" }
model_fetcher = { path = "../model_fetcher" }
model_loader = { path = "../model_loader" }
optimization = { path = "../optimization" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# NFKC for the quote check (ASG-Q3); already in Cargo.lock via pdf-extract.
unicode-normalization = "0.1.25"
